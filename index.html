ard with an open heart, even without a full plan.","a fresh, trusting new start","a careless leap or fear of starting","A young traveler stands at the edge of a cliff, looking up, not down. He carries a small bag and a white rose. A little white dog jumps beside him. The bright yellow sky feels hopeful. The cliff edge shows risk; the white rose and open posture show innocence and trust.",["You feel open and playful with someone new, without overthinking it.","You try a class or subject just because it sounds interesting.","You say yes to a new role even though you are still learning."],["You may rush into something without checking if it feels safe, or hold back from something new out of fear.","You might skip the planning step, or delay starting a big project because you feel unready.","You could take a risk without enough information, or freeze before a new opportunity."],["The Magician","Both are beginnings. The Fool has no tools out yet — he is just walking forward on trust. The Magician has all four suit tools on the table and is actively using them. Fool = 'I'll find out.' Magician = 'I can make this happen.'"],"Where in my life am I ready to begin before I feel fully ready?"],["The Magician",["skill","focus","action","resources","willpower"],"You have the tools you need, and focused action can turn an idea into something real.","using your skills and resources with focus","scattered effort, unused talent, or manipulation","A figure raises a wand to the sky with one hand and points to the earth with the other: 'as above, so below.' On the table are a cup, a wand, a sword, and a pentacle — all four suits. An infinity sign floats above the head. Red roses and white lilies grow below. This shows that the person has every tool and can connect ideas to real results.",["You clearly say what you want and take the first step.","You use your notes, classmates, and office hours together to master a topic.","You pitch an idea well and show you can deliver it."],["You may say the right words without real follow-through, or someone may be using charm to influence you.","You may have the skills but not be using them — procrastination or scattered focus.","You might overpromise, or doubt skills you actually have."],["The Fool","The Magician is skilled and in control, with tools on the table. The Fool is untested and carefree. If the card is about using what you already know, it is the Magician."],"What tools or skills do I already have that I am not using yet?"],["The High Priestess",["intuition","inner knowing","mystery","stillness","listening"],"Pause and listen to your quiet inner knowing; not everything is visible yet.","quiet intuition and inner knowing","ignoring your intuition, or secrets and confusion","A calm woman sits between a black pillar (B) and a white pillar (J). A veil with pomegranates hangs behind her, hiding what is beyond. She holds a scroll marked TORA, partly hidden. A crescent moon lies at her feet. The two pillars show opposites; the veil and scroll show hidden knowledge that comes through stillness, not action.",["You sense something about a person before they say it. Give it time.","You understand a concept better by reflecting quietly than by cramming.","You notice what is not being said in a meeting."],["You may ignore a gut feeling, or there may be hidden information between you.","You may overthink and stop trusting what you already understand.","You may feel out of the loop, or keep important thoughts to yourself."],["The Hermit","Both are quiet and inward. The High Priestess sits still and receives — she already knows, she just listens. The Hermit walks and searches with a lantern — he is actively looking for an answer by stepping away."],"What is my intuition telling me that I have not wanted to hear?"],["The Empress",["nurturing","abundance","creativity","comfort","growth"],"Growth comes through care, comfort, and creativity — like a garden that is well looked after.","nurturing care, creativity, and abundance","neglecting yourself, over-giving, or creative block","A relaxed woman sits on soft cushions in a lush garden. Wheat grows at her feet, a forest and stream are behind her, and a heart-shaped shield shows the symbol of Venus. She wears a crown of twelve stars. The wheat and nature show growth and abundance; her relaxed pose shows that growth can come from comfort, not stress.",["The relationship feels warm and caring, with room to grow.","A creative project or study habit is starting to bear fruit.","A supportive team where people feel looked after."],["You may give so much care to others that you forget yourself, or care may feel smothering.","You may feel creatively blocked or too tired to grow.","Burnout from caring for everyone else's tasks."],["Queen of Pentacles","Both are nurturing and earthy. The Empress is a big life theme of growth and creativity. The Queen of Pentacles is a specific person or practical style — managing home, money, and comfort day to day."],"Where do I need more care and comfort to grow?"],["The Emperor",["structure","authority","stability","rules","leadership"],"Clear structure, rules, and steady leadership create safety and order.","structure, leadership, and stable order","too much control, rigidity, or lack of discipline","A serious ruler sits on a stone throne decorated with ram heads. He wears armor under his robe and holds an ankh scepter and an orb. Behind him are bare, rocky mountains. The stone and armor show firmness and protection; the rams show strong will and leadership.",["Clear boundaries and reliable plans help the relationship feel safe.","A firm study schedule helps you succeed.","A manager or system that sets clear rules and expectations."],["Someone may try to control too much, or there may be no structure at all.","You may be too strict with yourself, or lack discipline.","A rigid boss or a messy workplace with no clear rules."],["King of Wands","Both are leaders. The Emperor leads with rules, systems, and stability. The King of Wands leads with vision, energy, and inspiration. Ask: is this about order (Emperor) or about passion and big ideas (King of Wands)?"],"Where would more structure help me, and where am I being too rigid?"],["The Hierophant",["tradition","learning","institutions","mentors","shared values"],"Learning from tradition, teachers, and shared rules can guide you.","tradition, mentors, and learning within a system","questioning tradition, or blindly following rules","A religious teacher sits between two pillars and raises a hand in blessing. Two students kneel before him. Two crossed keys lie at his feet. The keys show access to knowledge; the students show teaching passed from one person to another inside an established system.",["Shared values or family expectations matter in the relationship.","A formal program, professor, or certification path.","Following company procedures or learning from a senior mentor."],["You may feel pressure to follow rules that do not fit you, or you may choose your own path.","You may question the standard way to study or what program is 'expected.'","You may push against outdated rules or company culture."],["The Emperor","The Emperor makes the rules (power, structure). The Hierophant teaches the beliefs and traditions (knowledge, values). Emperor = boss; Hierophant = teacher or institution."],"Which traditions or rules truly support me, and which do I follow only out of habit?"],["The Lovers",["choice","connection","values","harmony","commitment"],"A meaningful connection or choice that asks you to follow your true values.","a values-based choice or deep connection","imbalance, mixed values, or avoiding a choice","A naked man and woman stand in a garden under an angel with spread wings. Behind the woman is a tree with a snake and apples; behind the man is a tree with flames. The bright sun is above. The angel shows a higher view; the two trees show a choice between different desires. It is about honest connection and choosing with your values.",["Strong mutual connection and honest communication.","Choosing a program or concentration that truly matches what you value.","A partnership or job choice that fits your values."],["You may feel out of sync with someone, or values may clash.","You may avoid a decision or choose what pleases others.","A conflict between what pays and what you believe in."],["Two of Cups","Both show connection. The Two of Cups is a simple, equal bond between two people. The Lovers is bigger: a meaningful choice guided by values, often with a higher force (the angel) watching."],"What do I truly value in this choice?"],["The Chariot",["determination","willpower","direction","control","progress"],"Move forward with focus and willpower, keeping opposite forces under control.","focused determination and forward progress","losing direction, or forcing things too hard","A warrior stands in a chariot under a starry canopy. Two sphinxes, one black and one white, sit in front. There are no reins — he steers by will alone. A city is behind him. The opposite-colored sphinxes show opposing forces he must keep together using focus and self-control.",["Working together to move the relationship forward.","Pushing through a hard term with clear goals.","Driving a project to the finish line."],["Mixed feelings may pull you in different directions.","You may lose motivation or push so hard you burn out.","A project may feel stuck, or you may try to control everything."],["Six of Wands","Both show a rider with success energy. The Chariot is the effort of moving forward — the journey. The Six of Wands is the victory parade after — the public recognition."],"What opposing feelings do I need to bring together to move forward?"],["Strength",["courage","patience","compassion","inner strength","gentleness"],"Real strength is gentle — patience and kindness can calm wild feelings.","gentle courage and patient inner strength","self-doubt, impatience, or harshness","A woman in white calmly closes (or opens) a lion's mouth with her bare hands. An infinity sign floats above her head and flowers decorate her waist. She does not fight the lion — she soothes it. This shows strength through calm, kindness, and self-control, not force.",["Being patient and kind when emotions run high.","Staying calm and steady during a hard exam period.","Handling a difficult coworker with grace."],["You may doubt yourself or react harshly.","Low confidence may make you give up too early.","Losing your temper, or feeling too timid to speak."],["The Chariot","Both show control. The Chariot controls by willpower and direction (outer drive). Strength controls by gentleness and patience (inner calm)."],"Where can I use gentleness instead of force?"],["The Hermit",["solitude","reflection","searching","wisdom","guidance"],"Step back from noise to search for your own answers, guided by inner light.","thoughtful solitude and searching for answers","isolation, loneliness, or refusing to look inward","An old man in a grey cloak stands alone on a snowy mountaintop. He holds up a lantern with a six-pointed star inside, and leans on a staff. The height and snow show distance from everyday life; the lantern shows inner wisdom lighting the next step only.",["Needing some time alone to understand your own feelings.","Deep independent study, or a research project.","Reflecting on your career direction before choosing."],["You may withdraw too much and feel lonely.","Studying alone so much you miss helpful support.","Avoiding reflection by staying busy."],["Four of Swords","The Hermit is active and awake — he walks with a lantern and searches for meaning. The Four of Swords is a person lying still to rest and recover. Hermit = seeking wisdom; Four of Swords = taking a break to heal."],"What answer could I find if I gave myself some quiet time?"],["Wheel of Fortune",["cycles","change","turning point","luck","timing"],"Life moves in cycles; a turning point or change of circumstances is here.","a turning point and changing cycles","resisting change, or a run of bad timing","A large wheel floats in the sky with letters and symbols on it. A sphinx sits on top, a snake goes down one side, and a red figure rises on the other. In the four corners, winged creatures read books. The wheel shows that things go up and down; the creatures show stability that stays steady through change.",["A new phase in the relationship begins.","Unexpected changes in courses or schedule.","A lucky opening or sudden change at work."],["You may feel stuck in a repeating pattern.","Plans may be interrupted by things outside your control.","A setback you could not have predicted."],["The World","Both feature four winged creatures in the corners. The Wheel is about change and cycles still moving. The World is about completion — the cycle is finished."],"What pattern keeps repeating, and what part of it can I change?"],["Justice",["fairness","truth","cause and effect","accountability","balance"],"Clear, fair decisions — what you do brings consequences that match.","fairness, truth, and clear accountability","unfairness, avoiding responsibility, or bias","A figure in red sits between two pillars, holding upright scales in one hand and a double-edged sword in the other. One white shoe peeks out. The scales show weighing things fairly; the sword shows clear, sometimes sharp decisions.",["Honest talks about what is fair for both people.","Grades that reflect your real effort.","Contracts, policies, and decisions made fairly."],["Something may feel unbalanced or not honest.","Feeling a grade or process was unfair; or avoiding responsibility.","Bias, or not owning a mistake."],["Two of Swords","Justice holds a sword and scales with eyes open and makes a decision. Two of Swords is blindfolded and avoids deciding."],"What would a fair and honest decision look like here?"],["The Hanged Man",["pause","new view","surrender","waiting","letting go"],"A pause that lets you see things from a completely new angle.","a meaningful pause and new perspective","stalling, or resisting a needed pause","A man hangs upside down by one foot from a living tree. His other leg is bent in a figure-4. His face is calm and a glowing halo surrounds his head. He is not suffering — he chose this. The upside-down view shows a new way of seeing; the halo shows insight.",["Seeing the other person's point of view.","Waiting for results, or studying a topic from a different angle.","A project on hold that lets you rethink the approach."],["Waiting too long, or feeling stuck without purpose.","Stalling on a decision you need to make.","Delays that feel pointless."],["Four of Swords","Both are a pause. The Four of Swords is rest to recover energy. The Hanged Man is a pause to gain a new perspective — the point is seeing differently, not just resting."],"What could I see if I looked at this upside down?"],["Death",["ending","transformation","transition","release","renewal"],"An ending that makes room for something new; rarely about physical death.","an ending that clears space for change","resisting an ending, or being stuck in the past","A skeleton in black armor rides a white horse, holding a black flag with a white rose. A king lies fallen; a bishop, a woman, and a child react differently. In the distance, the sun rises between two towers. The fallen king shows that change affects everyone; the rising sun shows renewal after an ending.",["A relationship pattern ends to make room for a healthier one.","Finishing one program or chapter of school.","Leaving a role or closing a project."],["Holding on to something that is already over.","Not letting go of an old plan that no longer fits.","Fear of change keeps you in a job you've outgrown."],["The Tower","Both are endings. Death is a natural, gradual transformation — like seasons changing. The Tower is sudden and shocking — something falls apart fast."],"What am I ready to let end?"],["Temperance",["balance","moderation","patience","blending","healing"],"Find the middle path by mixing things in the right amounts, with patience.","balance, moderation, and patient blending","imbalance, excess, or impatience","An angel stands with one foot in water and one on land, pouring liquid between two cups. A path leads to a glowing crown on the horizon. Irises bloom nearby. Pouring between cups shows blending and moderation; one foot on land and one in water shows balancing two different worlds.",["Finding a healthy middle ground together.","Balancing classes, work, and rest.","Combining different team ideas calmly."],["Too much of one thing — overwork, overspending, overthinking.","Cramming at the last minute instead of steady study.","Clashing priorities at work."],["Two of Pentacles","Both are about balance. The Two of Pentacles is juggling busy, practical tasks quickly. Temperance is a calm, slow blending — finding the right mix over time."],"What needs a little less, and what needs a little more?"],["The Devil",["attachment","habits","temptation","restriction","materialism"],"Notice what holds you — habits or attachments that feel hard to escape.","unhealthy attachments or habits that hold you","breaking free, or becoming aware of what binds you","A horned figure sits above a man and woman who are chained to his block. Their chains are loose enough to remove. They have small horns and tails. The loose chains show that the trap is partly by choice; the figure shows temptation and being controlled by habits.",["An unhealthy pattern, like jealousy or dependence.","Habits like phone scrolling that steal study time.","Staying in a job only for money or fear."],["Breaking a bad habit or realizing you can leave.","Starting to take control of your time.","Setting yourself free from a draining situation."],["Eight of Swords","Both show being trapped. In the Eight of Swords, fear and thoughts trap you. In The Devil, desires, habits, or attachments trap you — and the chains are loose."],"What chain in my life is looser than I think?"],["The Tower",["sudden change","upheaval","revelation","breakdown","truth"],"A sudden shake-up that breaks down false structures and reveals the truth.","a sudden shake-up and revealing truth","avoiding a needed change, or fearing collapse","A tall tower on a rocky peak is struck by lightning. Its crown falls off, flames burst out, and two people fall headfirst. Small yellow drops float in the air. The lightning shows sudden truth; the falling crown shows that false ideas or structures cannot stay.",["A surprising truth comes out and changes things.","Unexpected grade or major plan change.","Sudden restructuring at work."],["Trying to stop a change that is already happening.","Ignoring warning signs until later.","A crisis that is avoided or delayed."],["Death","Death is gradual, natural transformation. The Tower is sudden, dramatic, and often unexpected."],"What false belief might need to fall so something truer can be built?"],["The Star",["hope","healing","renewal","inspiration","calm"],"After a hard time, hope and healing return quietly.","hope, healing, and calm renewal","losing hope, or feeling disconnected","A naked woman kneels by a pool under a large star and seven small stars. She pours water from two jugs — one into the pool, one onto the land. A bird sits in a tree behind her. Her openness shows honesty and vulnerability; the stars and water show renewal and hope.",["Healing after a difficult moment; feeling hopeful again.","Renewed motivation after a hard term.","Feeling inspired about your career path."],["You may lose faith or feel discouraged.","Doubting whether your effort will pay off.","Feeling uninspired at work."],["The Sun","The Star is quiet hope after hard times (night sky). The Sun is full joy and success in daylight."],"What small thing gives me hope right now?"],["The Moon",["uncertainty","dreams","fear","illusion","intuition"],"Things are unclear; feelings and fears may make it hard to see the truth.","uncertainty, dreams, and unclear feelings","clarity returning, or confusion getting worse","A moon with a face shines between two towers. A dog and a wolf howl at it. A crayfish crawls out of a pool onto a winding path. The dim light shows things are not fully clear; the wolf and dog show our wild and tame sides; the path shows a journey through the unknown.",["Unclear signals; you may not know where you stand.","Confusion about course choices; anxiety affects study.","Unclear expectations or rumors at work."],["Confusion begins to clear, or fears lose their power.","Facing a fear about a hard subject.","Truth comes out after a period of rumors."],["The High Priestess","Both involve the moon and intuition. The High Priestess is calm inner knowing. The Moon is confusion and fear — intuition mixed with illusion."],"What fear might be making this look scarier than it is?"],["The Sun",["joy","success","clarity","warmth","confidence"],"Bright clarity, joy, and success — things feel warm and open.","joy, success, and clear warmth","temporary clouds, or joy that feels out of reach","A smiling child rides a white horse under a big, bright sun. Sunflowers grow behind a wall. The child holds a large red banner. The sun and child show simple joy and openness; the white horse shows purity; the sunflowers show growth toward light.",["Happy, honest, warm connection.","Good grades or clear understanding.","Success and recognition at work."],["Joy may be blocked for a moment, or you might overestimate success.","Minor setbacks hide your progress.","Overconfidence at work."],["Six of Wands","Both show success. The Sun is pure joy and clarity in general. Six of Wands is public praise for a specific win."],"What would I do today if I fully trusted myself?"],["Judgement",["awakening","calling","reflection","second chance","renewal"],"A wake-up call: look back honestly and rise to a new version of yourself.","an awakening call and honest self-review","self-doubt, or ignoring a calling","An angel blows a trumpet from the clouds. Below, people rise from coffins with open arms. Mountains are in the background. The trumpet is a call to wake up; the rising people show renewal and answering that call.",["Reviewing past patterns and choosing differently.","Realizing the program you really want.","A career calling or second chance."],["Being too hard on yourself, or ignoring an inner call.","Fear of making the wrong academic choice.","Missing an opportunity by hesitating."],["Death","Death is an ending. Judgement is waking up and rising after reflection. Judgement includes a calling to something new."],"What is calling me forward right now?"],["The World",["completion","wholeness","achievement","integration","travel"],"A cycle is complete; you have grown and can celebrate before the next one.","completion and wholeness","unfinished business, or not seeing the finish line","A dancer floats inside a large wreath, holding two wands. In the four corners are a lion, bull, eagle, and person. The wreath shows completion; the dancer shows freedom and harmony.",["The relationship feels complete or reaches a new level.","Graduating or finishing a big course.","Completing a project successfully."],["Something may not be quite finished.","Final assignments left undone.","Projects lacking closure."],["Ten of Cups","Both are happy endings. The World is personal completion of a cycle. Ten of Cups is emotional happiness in family or relationships."],"What chapter am I closing, and what did I learn?"]],"Major",0),...u([["Ace of Wands",["spark","inspiration","new idea","energy","potential"],"A spark of energy or a new idea that wants to grow.","a fresh spark of energy and inspiration","a delayed start or low motivation","A hand comes out of a cloud holding a sprouting wooden wand. Leaves fall from it. A castle sits on a hill in the background. The new leaves show growth; the hand from the cloud shows a gift of energy arriving.",["Excitement and attraction at the start of a connection.","A sudden interest in a new subject.","A new project idea that excites you."],["Attraction fades quickly, or timing feels off.","You can't find motivation to start.","An idea gets delayed or loses energy."],["Ace of Pentacles","Both are new beginnings. Ace of Wands is a spark of passion or an idea. Ace of Pentacles is a practical, real-world opportunity like money or a job offer."],"What idea is asking me to take action?"],["Two of Wands",["planning","future view","decisions","ambition","choices"],"Looking ahead and planning your next big move.","planning ahead and deciding direction","fear of leaving the comfort zone, or poor planning","A man in a castle holds a globe and looks out over the sea. One wand is fixed to the wall; he holds the other. The globe shows big plans; looking out shows thinking about the wider world.",["Thinking about where the relationship could go.","Planning your next term or concentration.","Considering a bigger career step."],["You stay comfortable instead of exploring.","You plan but do not commit.","Fear stops a career move."],["Three of Wands","Two of Wands is planning from inside the castle. Three of Wands is watching your plans already moving — ships are out at sea."],"What would I plan if I wasn't afraid?"],["Three of Wands",["expansion","progress","foresight","waiting for results","growth"],"Your plans are in motion; look ahead and prepare for growth.","expansion and watching plans unfold","delays, or plans that feel too small","A man stands on a cliff, his back to us, watching ships sail across the sea. Three wands are planted around him. The ships show your efforts are traveling outward; standing on high ground shows foresight.",["The relationship grows beyond the early stage.","Seeing progress after steady work.","Waiting for responses from applications."],["Results arrive slower than you hoped.","Feeling your efforts are not paying off yet.","Delays in expansion plans."],["Two of Wands","Three shows plans already in motion; Two shows planning before action."],"What am I waiting for, and how can I prepare for it?"],["Four of Wands",["celebration","home","milestone","welcome","stability"],"A happy milestone or celebration with people who make you feel at home.","celebration and a stable, happy milestone","tension at home, or a celebration delayed","Four wands form a canopy decorated with flowers. Two people wave bouquets; a castle and crowd are behind. The canopy shows a safe, joyful structure; the people show welcome and community.",["Meeting friends or family; feeling accepted.","Celebrating a finished term.","A team celebration or achieving a milestone."],["Feeling out of place, or plans delayed.","Not taking time to celebrate progress.","Team tension or lack of recognition."],["Ten of Cups","Four of Wands celebrates a milestone event. Ten of Cups shows long-lasting emotional happiness."],"What progress deserves to be celebrated?"],["Five of Wands",["competition","conflict","debate","rivalry","practice"],"Many people, many opinions — friendly competition or messy conflict.","competition and clashing ideas","avoiding conflict, or conflict ending","Five young men wave wands at each other. Nobody seems hurt — it looks more like practice or chaos. The crossed wands show clashing energy; the lack of injury suggests a challenge, not real danger.",["Small arguments or competing priorities.","Group projects with clashing opinions.","Office competition or debates in meetings."],["You avoid a conflict that needs to happen.","Group tension finally calms down.","Agreement after struggle."],["Seven of Wands","Five of Wands is a messy group struggle with no clear side. Seven of Wands is one person defending a position from higher ground."],"Is this conflict helping me grow, or just draining me?"],["Six of Wands",["victory","recognition","confidence","praise","success"],"Public success and recognition for your effort.","public victory and recognition","self-doubt, or lack of recognition","A rider on a white horse wears a laurel wreath and holds a wand with another wreath. People walk beside him. The wreath shows victory; the crowd shows public praise.",["Feeling proud of your relationship.","A good grade or award.","Recognition from your manager."],["Fear of failure or needing too much approval.","Feeling your work isn't seen.","Credit going to someone else."],["The Chariot","Six of Wands is the victory parade. The Chariot is the effort of driving forward."],"How can I enjoy success without needing others' approval?"],["Seven of Wands",["defending","standing firm","challenge","perseverance","boundaries"],"Stand your ground and defend what matters to you.","standing your ground under pressure","giving up, or feeling overwhelmed","A man on a hill holds one wand defensively while six wands rise from below. He wears mismatched shoes. The high ground shows advantage; the mismatched shoes suggest he had to act quickly.",["Setting boundaries in a relationship.","Defending your ideas in class.","Protecting your position or role at work."],["Feeling tired of defending yourself.","Giving in to pressure.","Losing confidence in your ideas."],["Five of Wands","Seven is one person defending from high ground. Five is a group clash with no clear side."],"What is worth defending, and what can I let go?"],["Eight of Wands",["speed","movement","news","momentum","action"],"Things move quickly — messages, progress, and fast action.","fast movement and quick news","delays, or rushing too fast","Eight wands fly through the air over a landscape. No people appear. The wands show movement and speed; the open sky shows nothing blocking them.",["Quick messages or fast progress.","Rapid learning or many deadlines.","Fast-moving projects or news."],["Mixed messages or delays.","Rushing through work and making mistakes.","Plans stall."],["Knight of Wands","Eight of Wands is fast events and messages. Knight of Wands is a person with fast, bold energy."],"Where do I need to speed up, and where do I need to slow down?"],["Nine of Wands",["resilience","persistence","fatigue","boundaries","last stretch"],"Tired but still standing — keep going, but protect your energy.","resilience in the final stretch","exhaustion, or feeling ready to quit","A wounded man with a bandaged head leans on a wand. Eight wands stand behind him like a fence. He looks tired and careful. The bandage shows past struggle; the fence shows defense and boundaries.",["Protecting your heart after past hurt.","Finishing the last weeks of a hard term.","Staying steady during a long project."],["Feeling too tired to continue.","Burnout before exams.","Giving up right before the finish."],["Seven of Wands","Seven is actively defending. Nine is tired, cautious, and close to the end."],"What do I need to keep going without burning out?"],["Ten of Wands",["burden","responsibility","overload","stress","hard work"],"Carrying too much — time to share or put some weight down.","carrying heavy responsibility","releasing burdens, or collapse from overload","A man carries ten wands toward a town. The wands block his view. He bends forward under the load. The heavy wands show too many responsibilities; blocked vision shows losing sight of the goal.",["Feeling responsible for everything in the relationship.","Too many classes and assignments.","Overloaded at work."],["Learning to delegate or say no.","Dropping a class to reduce stress.","Sharing workload."],["Nine of Wands","Nine shows tired resilience while defending. Ten shows carrying too much weight."],"What responsibility can I put down or share?"],["Page of Wands",["curiosity","exploration","enthusiasm","new interest","messages"],"A curious, excited learner ready to explore something new.","curious exploration and enthusiasm","distraction, or losing interest quickly","A young person holds a tall wand and looks at it with interest. Desert and pyramids are behind them, and salamanders decorate their shirt. The curious look shows learning; the desert shows a fresh landscape to explore.",["A playful, curious crush or message.","Excited to learn a new skill.","Exploring a new job area."],["Excitement fades fast; inconsistency.","Starting many things but not finishing.","Lack of follow-through."],["Knight of Wands","Page of Wands is curious and beginning to explore. Knight of Wands is already charging forward with bold action."],"What topic excites me right now?"],["Knight of Wands",["adventure","passion","bold action","impulsive","energy"],"Bold, passionate action that moves fast — sometimes too fast.","bold, passionate action","impulsiveness, or scattered energy","A knight on a rearing horse holds a wand. His armor has salamanders and flames. Desert and pyramids are behind. The rearing horse shows high energy and speed.",["Exciting, fast romance.","Diving into a new subject eagerly.","Taking bold career risks."],["Rushing in, then losing interest.","Starting projects without planning.","Making impulsive decisions."],["Eight of Wands","Knight is a person with bold energy. Eight is events moving fast."],"Where could passion help me — and where do I need patience?"],["Queen of Wands",["confidence","warmth","charisma","independence","creativity"],"A warm, confident person who inspires others and knows their worth.","warm confidence and charisma","insecurity, jealousy, or burnout","A queen sits on a throne decorated with lions, holding a wand and a sunflower. A black cat sits at her feet. The sunflower shows warmth and joy; the black cat shows independence and intuition.",["Confident and attractive energy.","Leading a group project with energy.","Inspiring others at work."],["Feeling insecure or jealous.","Losing confidence in class.","Burnout from doing too much."],["Queen of Pentacles","Queen of Wands is outgoing and inspiring. Queen of Pentacles is practical and nurturing."],"How can I show up confidently today?"],["King of Wands",["vision","leadership","entrepreneurship","inspiration","boldness"],"A visionary leader who turns big ideas into action.","visionary leadership and bold direction","impatience, or controlling leadership","A king sits on a throne decorated with lions and salamanders, holding a flowering wand. A small salamander sits nearby. The salamanders show fire and transformation; his posture shows readiness to act.",["Taking charge and planning big goals together.","Leading a club or project.","Entrepreneurial ideas or strong leadership."],["Being too demanding or impatient.","Leading without listening.","Big ideas without follow-through."],["The Emperor","King of Wands leads by vision and inspiration. The Emperor leads by order and rules."],"What big vision am I ready to lead?"]],"Wands",22),...u([["Ace of Cups",["new feelings","love","compassion","emotional start","openness"],"A new flow of feelings — love, kindness, or emotional openness.","a new flow of love and feeling","blocked or hidden emotions","A hand from a cloud holds a cup with five streams of water overflowing into a pond with lotus flowers. A dove drops a wafer into the cup. The overflowing water shows emotions filling up; the dove shows peace and spirit.",["New romance or deeper emotional connection.","Feeling inspired by a subject you love.","A role that feels emotionally fulfilling."],["Feelings are blocked or kept inside.","Low emotional energy for studying.","Feeling unappreciated at work."],["Ace of Wands","Ace of Cups is about emotions and love. Ace of Wands is about passion and new ideas."],"What feeling is ready to flow in my life?"],["Two of Cups",["partnership","mutual connection","attraction","harmony","respect"],"Two people meet as equals with mutual care and respect.","mutual connection and partnership","imbalance, or a disconnect between two people","Two people exchange cups. Above them is a winged lion's head over a staff with two snakes. The exchange shows mutual feelings; the symbol above shows balance and healing.",["Mutual attraction or a balanced relationship.","A good study partner.","A strong working partnership."],["One person gives more than the other.","Miscommunication with a partner.","Partnership tension."],["The Lovers","Two of Cups is a simple, mutual bond. The Lovers adds a big values choice."],"What makes a relationship feel equal for me?"],["Three of Cups",["friendship","celebration","community","joy","support"],"Celebrating with friends and feeling supported by community.","friendship and shared celebration","over-indulgence, or feeling left out","Three women raise their cups in a circle, dancing among fruit and flowers. The raised cups show celebration; the harvest shows abundance and joy.",["Fun times with friends or new social circles.","Study groups that feel supportive.","Team bonding or celebrations."],["Too much partying, or gossip.","Distraction from studies.","Feeling left out at work."],["Four of Wands","Three of Cups is friends celebrating together. Four of Wands is a milestone or home celebration."],"Who helps me feel joyful and supported?"],["Four of Cups",["apathy","boredom","reflection","missed opportunity","withdrawal"],"Feeling bored or closed off, and possibly missing what is offered.","boredom and missing what is offered","renewed interest, or seeing new options","A young man sits under a tree with crossed arms, looking at three cups. A hand from a cloud offers a fourth cup he doesn't notice. Crossed arms show being closed off; the offered cup shows an opportunity being missed.",["Feeling unexcited; not noticing someone's interest.","Boredom with your courses.","Ignoring new opportunities."],["Becoming open again.","New motivation in school.","Accepting a new opportunity."],["Eight of Cups","Four of Cups is sitting still and bored. Eight of Cups is actively walking away."],"What might I be overlooking right now?"],["Five of Cups",["disappointment","regret","grief","focus on loss","hope remaining"],"Sadness over what was lost, while some good still remains behind you.","grief and focusing on loss","moving on, or accepting a loss","A figure in a black cloak looks down at three spilled cups. Two cups stand behind them. A bridge leads to a house. The spilled cups show loss; the standing cups and bridge show hope and a way forward.",["Regret over a past relationship.","Disappointed by a grade.","Sadness after a career setback."],["Starting to heal and look forward.","Learning from mistakes.","Finding new paths."],["Three of Swords","Five of Cups is regret and focusing on loss (with hope behind). Three of Swords is sharp heartbreak or painful truth."],"What remains that I have not noticed?"],["Six of Cups",["nostalgia","memories","kindness","innocence","childhood"],"Sweet memories, kindness, and comfort from the past.","nostalgia and kind memories","stuck in the past, or moving forward","A child gives another child a cup filled with flowers. They are in a peaceful village. The flowers show kindness; the setting shows safety and childhood memories.",["Reconnecting with an old friend or past love.","Remembering why you liked a subject.","Returning to past skills."],["Living too much in the past.","Comparing now to old times.","Resisting change at work."],["Ten of Cups","Six of Cups is memories and innocence. Ten of Cups is present family happiness."],"Which memory still shapes how I feel today?"],["Seven of Cups",["choices","fantasy","dreams","illusion","options"],"Many dreamy options — some real, some illusion.","many choices and daydreams","clarity, or choosing realistically","A person sees seven cups in the clouds, each filled with something different: a castle, jewels, a snake, a veiled figure. The cups show choices; the clouds show they may not all be real.",["Confusion about what you want in love.","Too many electives or majors to choose.","Daydreaming about many career paths."],["Choosing what is real and practical.","Focusing on one goal.","Clear priorities."],["Two of Wands","Seven of Cups is daydreaming about many options. Two of Wands is planning one direction."],"Which option is real and which is only a dream?"],["Eight of Cups",["walking away","searching","letting go","emotional growth","change"],"Leaving something behind to search for deeper meaning.","walking away to find deeper meaning","fear of leaving, or wandering without purpose","A cloaked figure walks away from eight stacked cups toward mountains under the moon. The stacked cups show something incomplete; the path shows searching for more.",["Walking away from a relationship that no longer fulfills.","Leaving a program that doesn't fit.","Changing jobs for meaning."],["Fear of change; staying too long.","Hesitating to switch subjects.","Staying in a draining role."],["Four of Cups","Eight walks away. Four sits still and bored."],"What am I ready to walk away from?"],["Nine of Cups",["satisfaction","wish fulfilled","contentment","pleasure","gratitude"],"Feeling satisfied — a wish is coming true.","satisfaction and a wish fulfilled","dissatisfaction, or overindulgence","A man sits proudly with arms crossed in front of nine cups lined on a table. The cups show abundance; his posture shows satisfaction and pride.",["Enjoying a happy connection.","Getting the grade you hoped for.","Job satisfaction."],["Feeling something is missing.","Not satisfied even after success.","Over-indulging after a win."],["Ten of Cups","Nine is personal happiness. Ten is shared family or group happiness."],"What would make me truly satisfied?"],["Ten of Cups",["harmony","family","lasting happiness","home","emotional fulfillment"],"Deep happiness shared with family or loved ones.","lasting emotional harmony","family tension, or unrealistic ideals","A couple stands with arms raised under a rainbow of ten cups. Children dance beside them. A house sits in the distance. The rainbow shows emotional fulfillment; the family shows shared happiness.",["Long-term happiness or commitment.","Feeling supported by family while studying.","A team that feels like family."],["Tension at home.","Family pressure affects studies.","Workplace harmony is fragile."],["Nine of Cups","Ten is shared happiness. Nine is personal satisfaction."],"What does a happy home mean to me?"],["Page of Cups",["sensitivity","creativity","emotional message","curiosity","dreams"],"A gentle, imaginative message or new feeling.","gentle feelings and creative messages","emotional immaturity, or blocked creativity","A young person holds a cup with a fish peeking out. They stand near the sea and wear a flowered tunic. The fish shows surprise and imagination; the sea shows emotions.",["Sweet message or new crush.","Creative idea for a project.","Imaginative approach at work."],["Moodiness or oversensitivity.","Creative block.","Emotional reactions at work."],["Knight of Cups","Page is a new feeling or message. Knight acts on feelings with romantic gestures."],"What small creative idea wants attention?"],["Knight of Cups",["romance","charm","idealism","invitation","following the heart"],"Following your heart with romance, charm, or an invitation.","romantic, heart-led action","moodiness, or unrealistic promises","A knight rides slowly on a white horse, holding a cup forward like an offer. A stream flows nearby. The calm horse shows gentle movement; the offered cup shows romance or invitation.",["A romantic gesture or invitation.","Choosing a course because you love it.","Following a passion career."],["Promises without action.","Daydreaming instead of studying.","Unrealistic job dreams."],["Page of Cups","Knight acts on feelings. Page only receives new feelings."],"Where can I follow my heart wisely?"],["Queen of Cups",["empathy","intuition","compassion","emotional support","calm"],"A caring, intuitive person who understands feelings deeply.","empathy and emotional care","emotional overwhelm, or weak boundaries","A queen sits on a throne at the water's edge, holding a closed, ornate cup. The water shows emotions; the closed cup shows deep, private feelings.",["Caring, emotionally safe partner.","Supporting classmates.","Working in a helping role."],["Taking on others' emotions.","Overwhelmed by stress.","Emotional burnout."],["The High Priestess","Queen of Cups is emotionally caring. High Priestess is quiet intuition and mystery."],"How can I care for my feelings while helping others?"],["King of Cups",["emotional balance","calm leadership","wisdom","diplomacy","support"],"Calm emotional strength and steady support.","emotional balance and calm leadership","suppressed feelings, or emotional manipulation","A king sits on a throne floating on rough sea, calmly holding a cup. A fish jumps and a ship sails nearby. The sea shows emotions; his calmness shows control over them.",["Calm, supportive relationship.","Steady during stressful exams.","Leading with empathy."],["Hiding emotions.","Stress hidden behind calm face.","Manipulative leadership."],["Queen of Cups","King is calm control of emotions. Queen is deep emotional care."],"How do I stay calm when feelings are strong?"]],"Cups",36),...u([["Ace of Swords",["clarity","truth","breakthrough","new idea","decision"],"A clear idea or truth cuts through confusion.","a breakthrough of clear thinking","confusion, or harsh words","A hand from a cloud holds an upright sword topped with a crown, olive branch, and palm. Mountains are below. The upright sword shows clarity; the crown shows mental victory.",["Honest conversation that clears confusion.","Suddenly understanding a hard concept.","A clear decision at work."],["Miscommunication or harsh words.","Mental block while studying.","Unclear direction."],["Ace of Wands","Ace of Swords is mental clarity. Ace of Wands is excitement and passion."],"What truth do I need to say clearly?"],["Two of Swords",["indecision","stalemate","avoidance","difficult choice","balance"],"Stuck between two choices and avoiding seeing the full picture.","a stuck choice and avoidance","making a decision, or information overload","A blindfolded woman sits holding two crossed swords. The sea and a crescent moon are behind her. The blindfold shows avoiding information; the crossed swords show a stalemate.",["Avoiding a relationship conversation.","Not sure which concentration to pick.","Stuck between two job offers."],["Finally choosing a direction.","Too much information confuses you.","Pressure to decide quickly."],["Justice","Two of Swords avoids a choice (blindfolded). Justice makes a clear, fair choice."],"What would I see if I took off the blindfold?"],["Three of Swords",["heartbreak","grief","painful truth","hurt","release"],"A painful truth or heartbreak that needs to be felt.","heartbreak and painful truth","healing, or holding onto pain","Three swords pierce a red heart against a stormy sky with rain. The swords show painful thoughts; the rain shows sadness but also cleansing.",["Heartbreak or painful words.","Disappointment over results.","Hurtful feedback at work."],["Starting to heal.","Learning from mistakes.","Letting go of past hurt."],["Five of Cups","Three of Swords is sharp pain from truth or words. Five of Cups is regret and focusing on loss."],"What pain needs my gentle attention?"],["Four of Swords",["rest","recovery","pause","reflection","recharge"],"Rest and recover before you continue.","rest and quiet recovery","restlessness, or burnout","A knight lies on a tomb with hands in prayer. Three swords hang above him, one lies under him. A stained-glass window shows a scene of comfort. The resting figure shows recovery.",["Taking space to reflect.","Resting between exams.","Taking time off to recover."],["Burnout from no rest.","Studying non-stop.","Overworking."],["The Hermit","Four of Swords is lying still to recover. The Hermit walks and searches for answers."],"What kind of rest do I need most?"],["Five of Swords",["conflict","winning at a cost","ego","tension","defeat"],"A conflict where someone wins, but at a cost.","a hollow win and conflict","making peace, or regretting conflict","A man smirks while holding three swords; two people walk away sadly. Two swords lie on the ground. The smirk shows winning; the sad figures show losses.",["Arguments where nobody really wins.","Unfair group project behavior.","Workplace power struggles."],["Trying to make peace.","Letting go of competition.","Choosing cooperation."],["Five of Wands","Five of Swords is a hurtful conflict with winners and losers. Five of Wands is a messy but harmless clash."],"Is winning this worth the cost?"],["Six of Swords",["transition","moving on","recovery","travel","calm after storm"],"Moving away from trouble toward calmer waters.","a transition toward calmer waters","resisting change, or unresolved baggage","A boatman rows a woman and child across water. Six swords stand in the boat. The water on one side is rough, the other calm. The journey shows transition; the swords show carrying memories.",["Moving on from a difficult relationship.","Changing schools or programs.","Leaving a hard job."],["Feeling stuck in transition.","Unready to change programs.","Carrying old stress into new roles."],["Eight of Cups","Six of Swords is moving away with help to calmer places. Eight of Cups is walking away alone to search for meaning."],"What am I moving toward?"],["Seven of Swords",["strategy","secrecy","deception","independence","sneaking"],"Acting alone or secretly — be honest about the strategy.","secret strategy or independent action","coming clean, or getting caught","A man sneaks away from a camp carrying five swords, leaving two behind. He looks back over his shoulder. The sneaking shows secrecy; looking back shows guilt or caution.",["Secrets or not telling the full truth.","Cheating or shortcuts.","Office politics."],["Confessing or being found out.","Taking responsibility.","Choosing honesty."],["Five of Swords","Seven of Swords acts quietly and secretly. Five of Swords is open conflict."],"Am I being fully honest with myself?"],["Eight of Swords",["feeling trapped","self-limiting beliefs","fear","helplessness","restriction"],"Feeling trapped mostly by your own thoughts.","feeling trapped by limiting thoughts","breaking free, or new perspective","A blindfolded woman is loosely tied, surrounded by eight swords. There is space to walk out. The blindfold shows not seeing options; the loose ties show the trap is mental.",["Feeling stuck in relationship fear.","Thinking you can't succeed.","Feeling trapped in a job."],["Seeing new options.","Gaining confidence.","Leaving a bad situation."],["The Devil","Eight of Swords is trapped by thoughts and fear. The Devil is trapped by habits and desires."],"What thought is keeping me stuck?"],["Nine of Swords",["anxiety","worry","sleepless nights","fear","overthinking"],"Worry and anxiety that keep you up at night.","anxiety and overthinking","worry easing, or seeking help","A person sits up in bed with hands covering their face. Nine swords hang on the dark wall. The quilt has roses and astrological symbols. The darkness shows anxiety; the swords show heavy thoughts.",["Worrying about the relationship.","Exam anxiety.","Stress about job performance."],["Talking about worries.","Asking for support.","Learning to rest."],["Ten of Swords","Nine of Swords is worry about what might happen. Ten of Swords is the painful ending itself."],"What worry feels bigger at night than in daylight?"],["Ten of Swords",["painful ending","rock bottom","betrayal","exhaustion","new dawn"],"A painful ending — but the dawn is coming.","a painful ending with a new dawn ahead","recovery, or refusing to let go","A man lies face down with ten swords in his back. The sky is dark but a yellow sunrise appears on the horizon. The swords show complete defeat; the sunrise shows a new start.",["The end of a painful relationship.","Feeling exhausted after failing a test.","A job ending badly."],["Recovering after hardship.","Rising after failure.","Learning from a painful job end."],["The Tower","The Tower is a sudden shock. Ten of Swords is the final, exhausting end."],"What can begin after this ending?"],["Page of Swords",["curiosity","questions","learning","alertness","new ideas"],"A sharp, curious learner who asks questions.","curious, sharp thinking","gossip, or scattered thinking","A young person holds a sword upright on a windy hill, looking alert. Clouds and birds are behind. The wind shows ideas moving; the alert posture shows curiosity.",["Asking honest questions.","Researching a topic.","Learning new skills at work."],["Gossip or rumors.","Distracted thinking.","Saying things without thinking."],["Knight of Swords","Page asks questions and learns. Knight charges ahead with ideas."],"What question do I need to ask?"],["Knight of Swords",["action","speed","ambition","directness","rushing"],"Charging ahead with ideas — fast, direct, sometimes careless.","fast, direct action","recklessness, or harsh words","A knight rides a galloping horse with sword raised. Trees bend in the wind. The speed shows urgency; the raised sword shows determination.",["Being very direct in communication.","Rushing through study.","Taking quick action at work."],["Saying hurtful things.","Rushing and making mistakes.","Pushing too hard at work."],["Eight of Wands","Knight of Swords is a person rushing with ideas. Eight of Wands is events moving fast."],"Where do I need to slow down before I speak?"],["Queen of Swords",["clarity","honesty","independence","boundaries","wisdom"],"A clear-thinking person who speaks honestly and kindly.","clear honesty and boundaries","coldness, or harsh judgment","A queen sits on a throne holding an upright sword, one hand extended. Clouds gather, but she looks clear. The upright sword shows truth; the open hand shows fairness.",["Honest communication with boundaries.","Clear analysis in essays.","Fair, logical decisions."],["Being too critical.","Overthinking.","Cold communication at work."],["Queen of Cups","Queen of Swords uses logic and honesty. Queen of Cups uses empathy and feelings."],"How can I be honest and kind at the same time?"],["King of Swords",["authority","logic","truth","fairness","intellect"],"A fair leader who uses logic and clear rules.","logical, fair authority","manipulation, or abuse of power","A king sits on a throne holding an upright sword, facing forward. Butterflies decorate his throne. The sword shows truth; facing forward shows fairness.",["Fair and honest relationship talks.","Strong logical thinking.","Clear leadership."],["Using logic to control others.","Overly strict thinking.","Unfair leadership."],["Justice","King of Swords is a person or role. Justice is the principle of fairness."],"Am I using my mind to help or to control?"]],"Swords",50),...u([["Ace of Pentacles",["opportunity","money","stability","new job","prosperity"],"A practical new opportunity for growth or stability.","a practical new opportunity","missed opportunity, or poor planning","A hand from a cloud holds a large pentacle above a flowering garden. A path leads through an arch toward mountains. The pentacle shows material opportunity; the garden shows growth.",["A stable start to a relationship.","A scholarship or practical course.","A job offer or new income."],["Missed chance or poor timing.","Not using resources well.","Financial delays."],["Ace of Wands","Ace of Pentacles is practical and material. Ace of Wands is inspiration and passion."],"What practical opportunity is in front of me?"],["Two of Pentacles",["balance","juggling","adaptability","priorities","time management"],"Juggling many tasks while staying flexible.","juggling priorities and staying flexible","overwhelm, or dropping the ball","A man juggles two pentacles connected by an infinity loop. Ships ride waves behind him. The juggling shows balancing; the waves show ups and downs.",["Balancing relationship with other duties.","Managing classes and work.","Multitasking at work."],["Too much to handle.","Missing deadlines.","Poor time management."],["Temperance","Two of Pentacles is quick juggling. Temperance is slow, calm balance."],"What do I need to prioritize?"],["Three of Pentacles",["teamwork","collaboration","skill","learning","planning"],"Good work comes from teamwork and shared skills.","teamwork and skilled collaboration","poor teamwork, or lack of planning","A stonemason works on a cathedral while two people hold plans and talk to him. The cathedral shows building something lasting; the plans show collaboration.",["Working together as a team.","Group projects that go well.","Collaborating on work."],["Team conflict.","Poor group work.","Miscommunication."],["Eight of Pentacles","Three is teamwork. Eight is solo practice."],"Who can help me build this?"],["Four of Pentacles",["security","saving","control","holding on","possessiveness"],"Holding tightly to what you have for safety.","security and holding on tightly","letting go, or overspending","A man holds a pentacle tightly; one is on his crown, two under his feet. A city is behind him. The tight grip shows holding on; the city shows material focus.",["Fear of losing someone; possessiveness.","Being too careful with grades.","Saving money or protecting your job."],["Learning to share or open up.","Taking reasonable risks.","Spending more freely."],["Ten of Pentacles","Four is holding tight from fear. Ten is long-term wealth and family security."],"What am I holding too tightly?"],["Five of Pentacles",["hardship","lack","isolation","worry","asking for help"],"A hard time — but help may be closer than it seems.","hardship and feeling left out in the cold","recovery, or accepting help","Two people walk in snow outside a lit church window. One is on crutches. The cold shows hardship; the bright window shows help nearby.",["Feeling left out or unsupported.","Struggling financially as a student.","Job loss or money worries."],["Getting support.","Finding resources.","Recovery from financial stress."],["Five of Cups","Five of Pentacles is material hardship. Five of Cups is emotional loss."],"Where can I find support?"],["Six of Pentacles",["generosity","giving and receiving","fairness","charity","balance"],"Giving and receiving help fairly.","generosity and fair exchange","unequal giving, or strings attached","A merchant holds scales and gives coins to two kneeling people. The scales show fairness; giving shows generosity.",["Supporting each other equally.","Getting tutoring or helping peers.","Fair pay or charity."],["One-sided giving.","Unfair grading.","Unequal pay."],["Justice","Six of Pentacles is fair giving. Justice is fair decisions and truth."],"Do I give and receive in balance?"],["Seven of Pentacles",["patience","assessment","long-term growth","reflection","investment"],"Pause and check how your long-term effort is growing.","patient assessment of long-term growth","impatience, or wasted effort","A farmer leans on a hoe and looks at pentacles growing on a bush. The pause shows assessment; the plants show long-term growth.",["Thinking about long-term relationship growth.","Waiting for results of steady study.","Evaluating your career investment."],["Impatience with slow progress.","Effort without results.","Investing in the wrong thing."],["Eight of Pentacles","Seven is pausing to check results. Eight is actively working on skills."],"Is my effort going where I want it to grow?"],["Eight of Pentacles",["practice","skill","dedication","craft","learning"],"Steady practice and dedication to improve skills.","dedicated practice and skill-building","perfectionism, or lack of focus","A craftsman carves pentacles at a bench. Finished pentacles hang beside him. The repeated work shows practice; the focus shows dedication.",["Working on the relationship patiently.","Practicing problems for an exam.","Building job skills."],["Lack of motivation.","Repetitive study without improvement.","Perfectionism."],["Three of Pentacles","Eight is solo skill-building. Three is teamwork."],"What skill do I want to practice?"],["Nine of Pentacles",["independence","self-reliance","comfort","luxury","reward"],"Enjoying the comfort you've built through your own effort.","independence and earned comfort","over-dependence, or overworking","A woman stands in a lush garden of grapes and pentacles, a falcon on her gloved hand. The garden shows abundance; the falcon shows self-discipline.",["Feeling independent and secure.","Strong self-discipline in study.","Financial independence."],["Depending on others too much.","Overworking for comfort.","Financial insecurity."],["Ten of Pentacles","Nine is personal independence. Ten is family wealth."],"What have I built through my own effort?"],["Ten of Pentacles",["legacy","family","wealth","stability","long-term success"],"Lasting stability and success that can be shared with family.","lasting legacy and family stability","family conflict, or financial instability","An older man sits with dogs, watching a family under an archway. Ten pentacles form a pattern. The family shows legacy; the archway shows structure.",["Long-term commitment and family.","Education supported by family.","Stable long-term career."],["Family money stress.","Pressure to meet family expectations.","Job instability."],["Ten of Cups","Ten of Pentacles is material security. Ten of Cups is emotional happiness."],"What legacy do I want to create?"],["Page of Pentacles",["learning","study","new skill","practical goals","curiosity"],"A practical student eager to learn something useful.","practical learning and new goals","procrastination, or lack of follow-through","A young person holds a pentacle and looks at it closely. A green field and trees are behind. The careful gaze shows study; the field shows growth potential.",["Slow, careful start to a relationship.","Focused study or new course.","Starting a new job or training."],["Lack of focus.","Procrastination.","Unclear goals."],["Eight of Pentacles","Page is beginning to learn. Eight is practicing to master."],"What do I want to learn next?"],["Knight of Pentacles",["routine","reliability","hard work","patience","steady progress"],"Slow and steady progress through hard work.","reliable, steady hard work","boredom, or being stuck in routine","A knight sits on a still horse, holding a pentacle and looking at a plowed field. The still horse shows patience; the field shows hard work.",["Reliable, steady partner.","Consistent study routine.","Dependable worker."],["Too much routine.","Boredom with study.","Feeling stuck at work."],["Knight of Wands","Knight of Pentacles is slow and steady. Knight of Wands is fast and passionate."],"What steady step can I take today?"],["Queen of Pentacles",["nurturing","practical care","comfort","resourcefulness","home"],"A caring, practical person who makes life comfortable.","practical care and comfort","self-neglect, or overgiving","A queen sits in a garden holding a pentacle on her lap. A rabbit is near. Flowers surround her. The pentacle shows practical care; the rabbit shows fertility.",["Caring partner who makes life easier.","Balancing study with self-care.","Supportive role at work."],["Neglecting yourself.","Overloading with responsibilities.","Over-giving at work."],["The Empress","Queen of Pentacles is practical care. The Empress is a big theme of growth and creativity."],"How can I care for myself practically?"],["King of Pentacles",["success","wealth","stability","leadership","security"],"A stable, successful leader who builds lasting security.","stable success and practical leadership","greed, or poor financial choices","A king sits on a throne decorated with bulls and grapes, holding a pentacle. A castle is behind him. The grapes show abundance; the castle shows success.",["Stable, supportive partner.","Strong academic success.","Business success."],["Too focused on money.","Ignoring studies for money.","Poor financial choices."],["King of Wands","King of Pentacles is practical, money-focused leadership. King of Wands is visionary leadership."],"What does success mean to me?"]],"Pentacles",64)],d={Major:{element:"Spirit",area:"big life "We use the Rider–Waite–Smith deck (often called RWS). It was published in 1909, with art by Pamela Colman Smith. Most beginner books use it."]},{h:"Major Arcana — 22 cards",p:["‘Arcana’ means ‘secrets.’ The Major Arcana are numbered 0 (The Fool) to 21 (The World). They show big life themes: new beginnings, endings, love, change, hope.","When a Major card appears, you can read it as: ‘this is an important lesson or turning point.’"],example:"Example: The Tower (XVI) in a reading about school could point to a sudden change of plans — maybe a course gets cancelled — which feels big, not small."},{h:"Minor Arcana — 56 cards",p:["The Minor Arcana show everyday life: conversations, homework, money, small choices. There are four suits (like playing cards) with 14 cards each: Ace to Ten (40 ‘number cards’ or ‘pips’) and four Court Cards (16 total).","Quick math: 22 Major + 56 Minor = 78 cards."],example:"Example: The Eight of Pentacles shows someone carving coins at a bench. It is about daily practice — like doing practice problems every evening — not a life-changing event."}],terms:[{t:"Arcana",d:"‘Secrets.’ The name for the two main groups of cards."},{t:"Pip",d:"A numbered Minor card (Ace to Ten)."},{t:"Spread",d:"A layout of cards where each place (position) has a meaning."}],review:[{topic:"Deck basics",q:"How many cards are in the Major Arcana?",options:["14","22","56","78"],answer:1,explain:"There are 22 Major Arcana cards, numbered 0 (The Fool) to 21 (The World)."},{topic:"Deck basics",q:"A reading has three Major Arcana cards. What might this suggest?",options:["The question is about small daily details","The situation may involve big life themes","The reading is wrong","You should draw again"],answer:1,explain:"Major cards point to big themes and turning points, so many Majors suggest an important moment."},{topic:"Deck basics",q:"How many Court Cards are in the whole deck?",options:["4","12","16","22"],answer:2,explain:"Each of the four suits has 4 Court Cards (Page, Knight, Queen, King): 4 × 4 = 16."}]},{id:"suits",title:"The four suits: suit + number + picture",minutes:6,intro:"Every Minor card has three clues: its suit (the life area), its number (the stage of the story), and its picture (the details). Put them together and you can read cards you have never studied.",sections:[{h:"The four suits",p:["Wands (Fire): energy, passion, ambition, and action. Think: ‘What do I want to do?’","Cups (Water): feelings, relationships, and intuition. Think: ‘How do I feel?’","Swords (Air): thoughts, words, conflict, and decisions. Think: ‘What do I think?’","Pentacles (Earth): money, work, the body, and practical life. Think: ‘What is real and solid?’"]},{h:"Numbers tell the stage",p:["Ace = seed or start · 2 = choice or pair · 3 = first growth or group · 4 = stability or pause · 5 = challenge or loss · 6 = harmony or moving on · 7 = testing or strategy · 8 = movement or effort · 9 = almost complete · 10 = completion, or too much."]},{h:"Putting the clues together",p:["Three of Cups → Cups (feelings, friends) + 3 (group, first growth) + picture (three friends raising cups). Meaning: celebrating with friends.","Five of Pentacles → Pentacles (money, practical life) + 5 (loss, challenge) + picture (two people in snow outside a lit window). Meaning: practical hardship — but help may be nearby."],example:"Try it: Two of Swords → Swords (thinking) + 2 (choice) + picture (a blindfolded woman holding two crossed swords). Meaning: a stuck decision you might be avoiding."}],interactive:"suitbuilder",terms:[{t:"Element",d:"Fire, Water, Air, Earth. Each suit links to one, which gives it a mood."}],review:[{topic:"Suits & numbers",q:"Which suit is most connected to feelings and relationships?",options:["Wands","Cups","Swords","Pentacles"],answer:1,explain:"Cups are Water: emotions, love, friendship, and intuition."},{topic:"Suits & numbers",q:"A Five in any suit often shows…",options:["A fresh start","Celebration","A challenge or loss","Completion"],answer:2,explain:"Fives usually bring challenge, conflict, or loss — after the stability of the Fours."},{topic:"Suits & numbers",q:"You are asking about a budget for next term. Which suit would feel most relevant?",options:["Pentacles","Cups","Wands","Swords"],answer:0,explain:"Pentacles (Earth) are about money, work, and practical planning."}]},{id:"court",title:"Court Cards: people, roles, and behaviors",minutes:5,intro:"Court Cards are the ‘people’ of the deck. They can be read in three ways. You choose the one that fits your question best.",sections:[{h:"The four ranks",p:["Page — a student or messenger. Curious, new, still learning.","Knight — action and movement. Strong energy, sometimes too much.","Queen — inner mastery. Understands and cares; leads from the inside.","King — outer mastery. Takes charge and makes decisions; leads from the outside."]},{h:"Three ways to read a Court Card",p:["1. A person: someone in your life who acts like this card.","2. A role: a position you or someone else plays (the team lead, the new hire, the mentor).","3. A way of behaving: an approach you could take, or are already taking."],example:"Queen of Swords in ‘How should I prepare for my job interview?’ → Person: a clear, honest mentor who could do a mock interview with you. Role: you as a careful, prepared candidate. Behavior: answer clearly and honestly, keep good boundaries, and don’t over-explain."},{h:"Suit + rank",p:["Mix the rank with the suit: Knight (action) + Wands (passion) = fast, bold, exciting action. Knight + Pentacles (practical) = slow, steady, reliable action. Same rank, very different style."]}],interactive:"courtroles",review:[{topic:"Court cards",q:"Which Court rank is most like a curious student?",options:["Page","Knight","Queen","King"],answer:0,explain:"Pages are learners and messengers — curious and new."},{topic:"Court cards",q:"Knight of Pentacles shows up for ‘How should I study?’ Which reading as a behavior fits best?",options:["Cram everything tonight","Keep a slow, steady, reliable routine","Skip class and rest","Follow your heart only"],answer:1,explain:"Knight = action; Pentacles = practical and steady. Together: consistent, patient effort."},{topic:"Court cards",q:"What is a difference between a Queen and a King?",options:["Queens are always women","Queens lead from the inside; Kings lead from the outside","Kings are always better","There is no difference"],answer:1,explain:"Queens show inner mastery (understanding, care). Kings show outer mastery (deciding, directing). Any gender can be either."}]},{id:"reversals",title:"Upright and reversed cards",minutes:5,intro:"When a card appears upside down, we call it ‘reversed.’ Some readers use reversals and some don’t. Both ways are okay. You can turn them on or off in Practice.",sections:[{h:"A reversal is the same theme, expressed differently",p:["A reversed card is not simply ‘the bad version.’ It keeps the same theme, but the energy might be:","• Blocked — the theme is delayed or stuck. (Ace of Wands reversed: the spark is there, but you can't start.)","• Internalized — the theme happens inside you, not out in the world. (Six of Wands reversed: you feel proud privately, even without public praise.)","• Excessive — too much of the theme. (Four of Pentacles reversed can mean holding on so tightly it becomes fear — or the opposite, overspending.)"]},{h:"Context decides",p:["Choose the style that fits the question and the other cards. If you are unsure, write down two possibilities and see which one feels more honest."],example:"Strength reversed in ‘How can I prepare for my interview?’ — Blocked: confidence feels out of reach. Internalized: you’re strong inside but not showing it. Excessive: you’re pushing so hard you forget to be gentle with yourself."}],interactive:"reversals",terms:[{t:"Reversed",d:"A card that appears upside down in a reading."}],review:[{topic:"Reversals",q:"Which is NOT a common way to read a reversal?",options:["Blocked","Internalized","Excessive","Always the exact opposite and always bad"],answer:3,explain:"Reversals usually show the same theme as blocked, internal, or too much — not automatically ‘bad.’"},{topic:"Reversals",q:"Ace of Wands reversed, read as ‘blocked,’ might mean…",options:["A new idea you can’t get started on","A huge celebration","A peaceful ending","Perfect teamwork"],answer:0,explain:"The Ace of Wands is a spark of energy. Blocked, the spark is there but not catching fire yet."}]},{id:"question",title:"How to ask a good question",minutes:4,intro:"A good question makes a good reading. Open questions help you reflect. Yes/no or ‘will they…?’ questions make reading harder and give away your power.",sections:[{h:"Turn closed questions into open ones",p:["Instead of ‘Will I get the job?’ → ‘How can I prepare well for this interview?’","Instead of ‘Does he like me?’ → ‘What should I know as I get to know this person?’","Instead of ‘Should I add Accounting?’ → ‘What should I consider when deciding whether to add an Accounting concentration?’"]},{h:"Focus on what you can see and do",p:["Tarot can’t read another person’s mind or guarantee the future. Ask about your own view, your options, and your next steps. When a question is about someone else, read the cards as your perspective of them, not as facts about them."]}],review:[{topic:"Reading skills",q:"Which is the best open question?",options:["Will I pass?","Does she hate me?","What can help me feel ready for my exam?","Yes or no: should I quit?"],answer:2,explain:"It is open, focused on you, and points toward action."},{topic:"Reading skills",q:"Why avoid ‘What is he thinking about me?’",options:["It's too short","Tarot can’t know another person’s private thoughts; it works better for your own reflection","It uses the wrong suit","It needs Major cards only"],answer:1,explain:"Reframe it as ‘What do I want to understand about this connection?’"}]},{id:"threecard",title:"Reading a three-card spread",minutes:7,intro:"This is the goal skill. A three-card reading has three steps: read each card, read it in its position, and connect the three into one story.",sections:[{h:"Step 1: Notice details",p:["Look at each card before thinking about meanings. What colors, people, and objects do you see? What is the mood? Which direction are people facing?"]},{h:"Step 2: Card + position",p:["Common three-card layouts: Past · Present · Next step, or Situation · Challenge · Advice.","The position changes the message. The Five of Cups in ‘Past’ means an old disappointment that still affects you. In ‘Advice,’ it might mean: allow yourself to feel sad, then turn around and notice what remains."]},{h:"Step 3: Connect the cards",p:["Look for patterns: Are there many cards of one suit? Many Majors? Do the numbers go up (growth) or down? Do people in the cards face toward or away from each other?","Then write one or two sentences that tell a story from card 1 to card 3."],example:"Question: ‘How can I prepare for my job interview?’ — Situation: Page of Pentacles (you are a careful learner starting something new). Challenge: Nine of Swords (worry keeps you up at night). Advice: Eight of Pentacles (steady practice). Story: ‘I’m ready to learn, but worry gets loud. Practicing answers step by step may turn worry into confidence.’"}],interactive:"threecard",review:[{topic:"Reading skills",q:"What should you do first in a reading?",options:["Look up meanings","Notice the details in the pictures","Decide the answer","Shuffle again"],answer:1,explain:"Starting with what you see builds your own interpretation skills."},{topic:"Reading skills",q:"In a Situation–Challenge–Advice spread, the Eight of Pentacles in ‘Advice’ most likely suggests…",options:["Steady practice","Run away","A big party","A painful ending"],answer:0,explain:"Eight of Pentacles = skill and dedicated practice. As advice: keep practicing."},{topic:"Reading skills",q:"Your three cards are all Swords. What pattern might this point to?",options:["Lots of money","Thoughts, words, and decisions are central","Only good news","Physical health"],answer:1,explain:"Swords are Air: thinking, communication, and conflict."}]}],x=[{topic:"Deck basics",q:"What number is The Fool?",options:["0","1","21","22"],answer:0,explain:"The Fool is 0 — the start of the journey before anything happens."},{topic:"Deck basics",q:"Which card ends the Major Arcana?",options:["Judgement","The Sun","The World","The Star"],answer:2,explain:"The World (XXI) shows completion of the cycle."},{topic:"Suits & numbers",q:"Which suit is linked to the element Air?",options:["Wands","Cups","Swords","Pentacles"],answer:2,explain:"Swords are Air — thoughts and words, which move like wind."},{topic:"Suits & numbers",q:"Tens often show…",options:["A seed","Completion, or too much of something","A first choice","Rest"],answer:1,explain:"Ten is the end of the suit's story: complete (Ten of Cups) or overloaded (Ten of Wands)."},{topic:"Suits & numbers",q:"Wands are linked to which element?",options:["Water","Earth","Fire","Air"],answer:2,explain:"Wands are Fire: energy, passion, and action."},{topic:"Court cards",q:"The Knight of Cups could describe…",options:["A slow, practical worker","Someone who follows their heart and makes romantic gestures","A harsh critic","A rule-maker"],answer:1,explain:"Knight (action) + Cups (feelings) = acting on emotion and romance."},{topic:"Reversals",q:"Six of Wands reversed, read as ‘internalized,’ might mean…",options:["Feeling proud privately even without public praise","A big public parade","Total failure","Travel"],answer:0,explain:"Internalized: the victory theme happens inside you rather than in public."}];var l=a("aIIwE");let k="tarot-journal-v1",S={lessonsDone:[],flash:{},reversals:!0,quizStats:{right:0,total:0},journal:[]};function N(){try{let e=window.localStorage.getItem(k);if(e)return{...S,...JSON.parse(e)}}catch{}return S}function j(e){let t=[...e];for(let e=t.length-1;e>0;e--){let n=Math.floor(Math.random()*(e+1
